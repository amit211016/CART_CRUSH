<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">

<head>
    <meta charset="ISO-8859-1">
    <title>CartCrush</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg bg-primary fixed-top navbar-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-cart-shopping"></i> CartCrush
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- LEFT MENU -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/products">Products</a>
                </li>
            </ul>

            <!-- RIGHT MENU -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <!-- NOT LOGGED IN -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link active" href="/signin">LOGIN</a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link active" href="/register">REGISTER</a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link active" href="/admin">ADMIN</a>
                </li>

                <!-- LOGGED IN -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user"></i>
                        <span sec:authentication="name"></span>
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div th:replace="${content}"></div>

<!-- ================= FOOTER ================= -->
<footer style="background-color:blue; color:white; padding:20px 0;">
    <div style="text-align:center;">
        <a href="https://www.instagram.com/" target="_blank"
           style="margin:0 10px; color:white;">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="https://www.linkedin.com/" target="_blank"
           style="margin:0 10px; color:white;">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="https://www.facebook.com/" target="_blank"
           style="margin:0 10px; color:white;">
            <i class="fab fa-facebook"></i>
        </a>
    </div>

    <div style="text-align:center; margin-top:10px;">
        &copy; 2025 Cart Crush. All rights reserved.
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
