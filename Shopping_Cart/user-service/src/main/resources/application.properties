spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2263
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret=dev-secret-key-should-be-long-and-random-256bit-min
security.jwt.ttl-seconds=3600

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

logging.level.org.springframework.security=INFO
server.error.include-message=always
