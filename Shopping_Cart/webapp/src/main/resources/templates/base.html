<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">

<head>
    <meta charset="UTF-8">
    <title>CartCrush</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --brand-primary: #0d6efd;
            --brand-secondary: #6610f2;
            --brand-accent: #ff7a59;
            --bg-muted: #f5f7fb;
            --text-dark: #0f172a;
        }
        body { background: var(--bg-muted); color: var(--text-dark); }
        .btn-brand { background: var(--brand-primary); color: #fff; border: none; }
        .btn-brand:hover { background: #0b5ed7; color: #fff; }
        .hero-card { border: none; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.12); }
        .pill { border-radius: 999px; padding: 6px 14px; background: rgba(13,110,253,0.12); color: var(--brand-primary); font-size: 0.85rem; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.4px; }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg fixed-top navbar-dark" style="background: linear-gradient(90deg, #0d6efd 0%, #6610f2 100%); box-shadow: 0 6px 16px rgba(0,0,0,0.12);">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-cart-shopping"></i> CartCrush
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- LEFT MENU -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/products">Products</a>
                </li>
            </ul>

            <!-- RIGHT MENU -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <!-- Anonymous -->
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="nav-link active" href="/signin">LOGIN</a>
                </li>
                <li class="nav-item" th:if="${session.user == null}">
                    <a class="nav-link active" href="/register">REGISTER</a>
                </li>

                <!-- Admin shortcut -->
                <li class="nav-item" th:if="${session.user != null and session.user.role == 'ROLE_ADMIN'}">
                    <a class="nav-link active" href="/admin">ADMIN</a>
                </li>

                <!-- Logged-in dropdown -->
                <li class="nav-item dropdown" th:if="${session.user != null}">
                    <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user"></i>
                        <span th:text="${session.user.name}">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text text-muted small" th:text="${session.user.email}">email</span></li>
                        <li th:if="${session.user.role != null}">
                            <span class="dropdown-item-text">
                                <span class="badge bg-primary" th:text="${session.user.role}">ROLE_USER</span>
                            </span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>

        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div th:replace="${content}"></div>

<!-- ================= FOOTER ================= -->
<footer style="background-color:blue; color:white; padding:20px 0;">
    <div style="text-align:center;">
        <a href="https://www.instagram.com/" target="_blank"
           style="margin:0 10px; color:white;">
            <i class="fab fa-instagram"></i>
        </a>

        <a href="https://www.linkedin.com/" target="_blank"
           style="margin:0 10px; color:white;">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="https://www.facebook.com/" target="_blank"
           style="margin:0 10px; color:white;">
            <i class="fab fa-facebook"></i>
        </a>
    </div>

    <div style="text-align:center; margin-top:10px;">
        &copy; 2025 Cart Crush. All rights reserved.
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
